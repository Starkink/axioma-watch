# Наблюдатель снаружи: раз в 5 минут проверяет сайт и кабинет Axioma и пишет
# в Telegram, если что-то не открывается (watch.mjs). Репозиторий открытый —
# так GitHub не ограничивает минуты. Настройки — в закрытых секретах.
name: watch
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Состояние прошлой проверки
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-
      - name: Проверить сайт и кабинет
        env:
          ALERT_TELEGRAM_TOKEN: ${{ secrets.ALERT_TELEGRAM_TOKEN }}
          ALERT_TELEGRAM_CHAT: ${{ secrets.ALERT_TELEGRAM_CHAT }}
        run: node watch.mjs
      - name: Запомнить состояние
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: watch-state-${{ github.run_id }}
      # GitHub выключает расписание, если в репозитории 60 дней не было коммитов.
      - name: Не дать GitHub уснуть
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "axioma-watch"
            git config user.email "axioma-watch@users.noreply.github.com"
            git commit --allow-empty -m "Наблюдатель жив"
            git push
          fi
